
name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build and Analyse
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SonarScanner
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Begin SonarQube analysis
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin /k:"Divine6747_Software-Design-Pattern-AirlineSYS" /o:"divine6747" /d:sonar.token="$env:SONAR_TOKEN"

      - name: Build solution
        shell: pwsh
        run: msbuild AirlineSYS.sln /t:Rebuild /p:Configuration=Release /m

      - name: End SonarQube analysis
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
